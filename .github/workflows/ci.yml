
name: Python Application CI-CD

on:
  push:
    branches:
      - main

jobs:

  # JOB 1: Build and Test
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          python -m pytest -v

      - name: Build Successful
        run: echo "CI completed successfully"

  # JOB 2: Deploy to OCI
  deploy:
    name: Deploy to OCI VM
    needs: build-and-test
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Deploy Application
        run: |
          echo "Starting deployment to OCI VM"

          cp app.py requirements.txt /opt/myapp/

          python3 -m venv /opt/myapp/venv

          /opt/myapp/venv/bin/pip install -r /opt/myapp/requirements.txt

          sudo /usr/bin/systemctl restart myapp.service

          sleep 3

          curl --fail http://localhost:8000/health

          echo "Deployment completed successfully"

